<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIBIT Admin Dashboard</title>
    <meta name="description" content="Login ke SIBIT Admin Dashboard untuk mengelola data bibit kelapa sawit">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <div class="icon">🌴</div>
                <h1>SIBIT</h1>
                <p>Sistem Informasi Bibit — Admin Panel</p>
            </div>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/admin/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">Masuk ke Dashboard</button>
            </form>
        </div>
    </div>
</body>

</html>
